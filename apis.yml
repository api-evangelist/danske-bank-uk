- aid: danske-bank-uk:danske-bank-uk-domestic-standing-orders-api
  name: Danske Bank (UK) Domestic Standing Orders API
  description: >-
    Danske Bank only supports GBP standing orders for one fixed amount on a specified frequency for a
    defined period or open-ended. Standing Orders can only be requested on GBP current accounts and are
    only processed Monday to Friday. Payments within the standing order schedule which fall on a weekend
    or holiday will be processed on the following working day. First payment date/time cannot be greater
    than 1 year.
  humanURL: https://developers.danskebank.com/api_products/danske_bank_apis/od?view=reference
