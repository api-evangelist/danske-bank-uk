aid: danske-bank-uk
url: https://raw.githubusercontent.com/api-evangelist/danske-bank-uk/refs/heads/main/apis.yml
name: Danske Bank (UK)
kind: company
description: >-
  Danske Bank (UK) is the trading name of Northern Bank Limited, a retail and
  commercial bank headquartered in Belfast and the largest bank in Northern
  Ireland. It is a wholly owned subsidiary of Denmark's Danske Bank Group and is
  authorised by the UK Prudential Regulation Authority and regulated by the
  Financial Conduct Authority and PRA. As "Northern Bank Limited t/a Danske
  Bank" it is one of the CMA9 - the nine largest current-account providers
  mandated by the UK Competition and Markets Authority to implement the Open
  Banking standard - and an FCA-authorised ASPSP under PSD2. It publishes the
  UK Open Banking (OBIE) API family: a public, unauthenticated Open Data API
  (ATMs, branches, personal and business current accounts, unsecured SME loans,
  commercial credit cards) and the FAPI-secured Read/Write APIs for Account and
  Transaction Information (AIS), Payment Initiation (PIS), Confirmation of Funds
  (CBPII), Variable Recurring Payments (VRP), and Events, alongside a suite of
  premium corporate APIs (account transaction and balance reporting, payment
  collection, corporate payment initiation, and FX trade reporting and
  execution) exposed through the Danske Bank developer portal.
