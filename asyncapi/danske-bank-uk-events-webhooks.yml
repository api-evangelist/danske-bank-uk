  which delivers real-time notifications about account and payment resource
  changes to registered Third Party Providers. The bank supports the
  aggregated-polling model (TPP polls for queued event notifications) via the
  /events endpoint; individual event notifications are signed JWTs following the
  OBIE Security Event Token (SET) profile.
