    request_schema: OBEventPolling1
    response_schema: OBEventPollingResponse1
  format: >-
    Each event notification is a signed JWT (Security Event Token) carrying the
    subject resource, the event type URI, and status-reason codes
    (OBExternalStatusReason1Code).
event_types:
  values:
    - urn:uk:org:openbanking:events:resource-update
  notes: >-
    Event subjects cover account-access-consent and payment-consent/payment
    resource lifecycle updates (e.g. consent status changes, payment status
    transitions). The precise event-type URIs are governed by the OBIE Event
    Notification standard.
security:
