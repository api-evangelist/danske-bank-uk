openapi: 3.2.0
info:
  title: Opendata BCA API
  description: Open Data API V2.2 for Danske Bank
  version: 4.3.3
  x-db-template-version: 1.0.0
servers:
- description: prod Environment
  url: https://obp-data.danskebank.com/v2.2
tags:
- name: BCA
paths:
  /business-current-accounts:
    get:
      tags:
      - BCA
      summary: Gets a list of all Business Current Account objects
      description: Gets a list of all Business Current Account objects
      parameters:
      - name: If-Modified-Since
        in: query
        schema:
          type: string
      - name: If-None-Match
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/BusinessCurrentAccountsResponse'
              example:
                meta:
                  LastUpdated: '2025-08-11T16:00:51.831Z'
                  TotalResults: 5
                  Agreement: Use of the APIs and any related data will be subject to the terms of the Open Licence and subject to terms and conditions
                  License: https://www.openbanking.org.uk/open-licence
                  TermsOfUse: https://www.openbanking.org.uk/terms-conditions
                data:
                - BrandName: DanskeBank
                  BCA:
                  - Name: Danske Charity Account
                    Identification: 41C
                    Segment:
                    - NonCommercial
                    OnSaleIndicator: true
                    BCAMarketingState:
                    - Identification: 41C
                      MarketingState: Regular
                      FirstMarketedDate: 01/01/1900
                      LastMarketedDate: 31/12/9999
                      Overdraft:
                        OverdraftTierBandSet:
                        - TierBandMethod: Whole
                          OverdraftType: OnDemand
                          Identification: 41D-Arranged
                          AuthorisedIndicator: true
                          OverdraftTierBand:
                          - Identification: 41D-25k
                            TierValueMin: '1'
                            TierValueMax: '25000'
                            EAR: '11.46'
                            OverdraftInterestChargingCoverage: Whole
                            Notes:
                            - Unsecured overdrafts between 1GBP and 25,000GBP will have a debit interest rate of 7% plus Bank of England Bank Rate.
                    FeaturesAndBenefits:
                      FeatureBenefitItem:
                      - Identification: Free On-line Payments Module
                        Type: Other
                        Textual: Customer gets free access to online payments module to enable them to make payments from the accounts.
                      Card:
                      - Type: DebitCard
                        Scheme:
                        - MasterCard
                        ContactlessIndicator: true
                        MaxDailyCardWithdrawalLimit: '350'
                      MobileWallet:
                      - Type: IssuerMobileApp
                    OtherFeesCharges:
                    - FeeChargeDetail:
                      - FeeCategory: Auto
                        FeeType: FPSOut
                        FeeAmount: '0.05'
                        ApplicationFrequency: Monthly
                        CalculationFrequency: PerItem
                    CoreProduct:
                      ProductURL: https://danskebank.co.uk/business/products-and-services/business-current-accounts/danske-charity-account
                      ProductDescription: A current account for registered charities.
                      TcsAndCsURL: http://www.danskebank.co.uk/sitecollectiondocuments/business/accounts/tcs-business-accounts.pdf
                      SalesAccessChannels:
                      - Branch
                      - RelationshipManager
                      ServicingAccessChannels:
                      - Branch
                      - CallCentre
                      - Post
        '400':
          description: Bad request
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: 400
                message: Bad request
                detail: You have sent a request which could not be understood
        '408':
          description: Client timeout
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: 408
                message: Client timeout
                detail: Your client has failed to submit a request, and a timeout has occurred
        '429':
          description: Too many requests
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: 429
                message: Too many requests
                detail: You have requested this resource too often, slow down
        '500':
          description: Internal Server Error
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: 500
                message: Internal Server Error
                detail: Failed to retrieve business current accounts
        '503':
          description: Service temporarily unavailable
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: 503
                message: Service temporarily unavailable
                detail: The service is temporarily unavailable
