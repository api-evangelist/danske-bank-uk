                      LoanInterest:
                        description: Details about the interest that may be payable to the SME Loan holders
                        type: object
                        required:
                        - LoanInterestTierBandSet
                        properties:
                          Notes:
                            type: array
                            items:
                              description: Optional additional notes to supplement the LoanInterest
                              type: string
