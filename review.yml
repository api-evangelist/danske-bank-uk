actions:
  openapiHarvested: true
  openapiCount: 11
  openDataConfirmed: true
  reason: >-
    Real UK Open Banking surface captured: one confirmed-live public Open Data
    API plus the FAPI-secured OBIE Read/Write family (AIS, PIS, CBPII, VRP,
    Events) and five premium first-party corporate APIs, all with OpenAPI
    documents harvested verbatim from the bank's own developer gateway.
